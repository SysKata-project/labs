name: Secret scanning
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: go install -ldflags="-X github.com/zricethezav/gitleaks/v8/cmd.Version=8.27.2" github.com/zricethezav/gitleaks/v8@v8.27.2
      - name: Scan all fetched history with redacted findings
        run: PATH="$(go env GOPATH)/bin:$PATH" sh scripts/scan-secrets.sh history
