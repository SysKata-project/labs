name: Feasibility tooling
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test validation safety boundaries
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax and patch whitespace
        run: |
          python3 -m py_compile scripts/validate-openshift.py
          git diff --check
