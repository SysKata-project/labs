# Launch a separate process with -Dquarkus.profile=assessment. No HTTP/terminal listener.
quarkus.http.host-enabled=false
quarkus.http.domain-socket-enabled=false
quarkus.management.enabled=false
labs.worker-enabled=false
assessment.enabled=true
labs.kubeconfig=/nonexistent/controller-not-mounted
labs.internal-token=disabled-worker-no-ingress
labs.terminal-image=disabled-worker-no-terminal
labs.api-cidr=127.0.0.1/32
assessment.kubeconfig=${ASSESSMENT_KUBECONFIG}
assessment.result-url=${ASSESSMENT_RESULT_URL}
assessment.token-url=${ASSESSMENT_TOKEN_URL}
assessment.client-id=${ASSESSMENT_CLIENT_ID}
assessment.client-secret=${ASSESSMENT_CLIENT_SECRET}
