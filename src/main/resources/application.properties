quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${LAB_DB_USER}
quarkus.datasource.password=${LAB_DB_PASSWORD}
quarkus.datasource.jdbc.url=${LAB_DB_URL}
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.oidc.enabled=false
quarkus.http.access-log.enabled=false
quarkus.websockets-next.server.max-frame-size=16384
quarkus.websockets-next.server.max-message-size=16384
labs.internal-token=${LAB_INTERNAL_TOKEN}
labs.kubeconfig=${LAB_KUBECONFIG}
labs.cluster-helper=${LAB_CLUSTER_HELPER:scripts/cluster.py}
labs.terminal-image=${LAB_TERMINAL_IMAGE}
labs.api-cidr=${LAB_API_CIDR}
labs.route-domain=${LAB_ROUTE_DOMAIN}
labs.worker-enabled=true
